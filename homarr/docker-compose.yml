# Homarr: the dashboard at home.<domain> (and dash.<domain>); replaced Homepage 2026-09-30. Runs on prdsrv1.
# Its boards, apps and integrations live in data/db/db.sqlite; integration secrets in there are
# encrypted with SECRET_ENCRYPTION_KEY (.env; 1Password item prdsrv1-homarr), so both are needed
# for a restore. Container lists come from the read-only socket proxies on all three hosts
# (docker-socket-proxy), never from a full Docker socket.
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.77.2
    container_name: homarr
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/London
      # Names shown in the container widget's Host column: prdsrv1 is the proxy's alias on the
      # proxy network (docker-socket-proxy PROXY_ALIAS), the others map to their addresses.
      - DOCKER_HOSTNAMES=prdsrv1,prdsrv2,prdsrv3
      - DOCKER_PORTS=2375,2375,2375
    extra_hosts:
      - "prdsrv2:10.69.20.114"
      - "prdsrv3:10.69.20.115"
    volumes:
      - ./data:/appdata
    networks:
      - proxy

networks:
  proxy:
    external: true
