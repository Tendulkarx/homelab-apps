# Every app tile on the Homelab board, in order within its group. layout.py creates or updates
# the apps in Homarr from this file and places the tiles (one balanced row per group), so a new
# or changed tile is one edit here, then `python3 theme/layout.py` on the Mac.
#   icon: a name from github.com/homarr-labs/dashboard-icons (svg), or a full https:// address
#   ping: the address Homarr checks for the status dot; leave it out for no dot
# An app listed under [[off_board]] is kept in Homarr (other links use it) but not shown.

[[tile]]
group = "Apps"
name = "Paperless"
href = "https://paperless.example.com"
icon = "paperless-ngx"
ping = "https://paperless.example.com"
description = "Documents and OCR"

