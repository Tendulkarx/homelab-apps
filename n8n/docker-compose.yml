services:
  n8n:
    image: ghcr.io/n8n-io/n8n:3.0.1
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/London
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_URL=https://n8n.${DOMAIN:?set DOMAIN in .env}
      - N8N_HOST=n8n.${DOMAIN:?set DOMAIN in .env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Behind one proxy (Caddy): trust its X-Forwarded-For, which n8n otherwise rejects
      - N8N_PROXY_HOPS=1
    volumes:
      - ./data:/home/node/.n8n
    # Until Caddy moves to this host (phase 6), Caddy on prdsrv2 reaches it over the LAN:
    # PUBLISH_IP=10.69.20.113 in .env. Unset, it is published on localhost only.
    # Its one job SSHes to prdsrv2 (10.69.20.114), where property-search stays beside Postgres.
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:5678:5678"
    networks:
      - proxy

networks:
  proxy:
    external: true
