# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    cpu: true
    memory: true
    disk: /

- datetime:
    locale: en-GB
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
      timeZone: Europe/London

# Coordinates set to Hounslow, West London as a starting point; update
# latitude and longitude below if your homelab or usual location differs.
# No API key needed, this uses Homepage's built-in Open-Meteo integration.
- weather:
    latitude: 51.4685
    longitude: -0.3607
    units: metric
    cache: 5

- search:
    provider: google
    target: _blank