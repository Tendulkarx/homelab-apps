services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.example.com
    volumes:
      - ./config:/app/config
    # Until Caddy moves to this host (phase 6), Caddy on prdsrv2 reaches it over the LAN:
    # PUBLISH_IP=10.69.20.113 in .env. Unset, it is published on localhost only.
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:3000:3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
