services:
  metabase:
    image: metabase/metabase:v0.64.3.3
    container_name: metabase
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/London
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=${METABASE_DB_PASSWORD}
      - MB_DB_HOST=postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Runs on prdsrv1; Postgres stays on prdsrv2. Keeps the name `postgres` (here and in the
      # Property Search data source) pointing at it.
      - "postgres:10.69.20.114"
    volumes:
      - ./data/plugins:/plugins
    # Until Caddy moves to this host (phase 6), Caddy on prdsrv2 reaches it over the LAN:
    # PUBLISH_IP=10.69.20.113 in .env. Published on 3030 (3000 was taken when this was added).
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:3030:3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
