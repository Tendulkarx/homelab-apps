services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.17.0
    container_name: arcane
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/docker:/opt/docker
    # Caddy reaches it over the proxy network (arcane:3552); published on localhost only.
    # PUBLISH_IP in .env would publish it on the LAN (only needed while Caddy was on prdsrv2).
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:3552:3552"
    networks:
      - proxy

networks:
  proxy:
    external: true