services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.14.0
    container_name: arcane
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/docker:/opt/docker
    # Until Caddy moves to this host (phase 6), Caddy on prdsrv2 reaches it over the LAN:
    # PUBLISH_IP=10.69.20.113 in .env. Unset, it is published on localhost only.
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:3552:3552"
    networks:
      - proxy

networks:
  proxy:
    external: true