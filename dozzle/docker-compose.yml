# Live logs of every container on this host, at logs.<domain>. View only: container actions and
# the shell stay off. Login is Dozzle's own; data/users.yml is rebuilt from 1Password (README).
services:
  dozzle:
    image: amir20/dozzle:v11.1.2
    container_name: dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_HOSTNAME=prdsrv2
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_AUTH_TTL=48h
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
