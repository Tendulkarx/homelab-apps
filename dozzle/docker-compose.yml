# Live logs of every container, at logs.<domain>: this host's own, plus prdsrv2's and prdsrv3's
# through their dozzle-agent (DOZZLE_REMOTE_AGENT in .env). View only: container actions and the
# shell stay off. Login is Dozzle's own; data/users.yml is rebuilt from 1Password (README).
# data/cert.pem and data/key.pem: this lab's own agent certificate (dozzle-agent/README.md), so
# no other Dozzle can read the agents.
services:
  dozzle:
    image: amir20/dozzle:v11.3.2
    container_name: dozzle
    restart: unless-stopped
    environment:
      - DOZZLE_HOSTNAME=${DOZZLE_HOSTNAME:-prdsrv1}
      - DOZZLE_REMOTE_AGENT=${DOZZLE_REMOTE_AGENT:-}
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_AUTH_TTL=48h
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
      - ./data/cert.pem:/dozzle_cert.pem:ro
      - ./data/key.pem:/dozzle_key.pem:ro
    # Until Caddy moves to this host (phase 6), Caddy on prdsrv2 reaches it over the LAN:
    # PUBLISH_IP=10.69.20.113 in .env. Unset, it is published on localhost only.
    ports:
      - "${PUBLISH_IP:-127.0.0.1}:8080:8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
