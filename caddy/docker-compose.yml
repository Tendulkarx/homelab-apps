services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The folder, not the file: git pull replaces the file, which a file mount never sees.
      # After a pull: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
      - ./etc:/etc/caddy:ro
      - ./data:/data
      - ./config:/config
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
