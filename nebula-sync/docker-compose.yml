# Keeps the second Pi-hole (on prdsrv3) in step with the primary (on prdsrv2): block lists,
# allow and deny lists, groups, clients and local DNS records, every hour. Runs on prdsrv3.
services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:v0.11.2
    container_name: nebula-sync
    restart: unless-stopped
    environment:
      - TZ=Europe/London
      - PRIMARY=${PRIMARY}
      - REPLICAS=${REPLICAS}
      - FULL_SYNC=false
      - CRON=0 * * * *
      - RUN_GRAVITY=true
      - SYNC_CONFIG_DNS=true
      - SYNC_GRAVITY_GROUP=true
      - SYNC_GRAVITY_AD_LIST=true
      - SYNC_GRAVITY_AD_LIST_BY_GROUP=true
      - SYNC_GRAVITY_DOMAIN_LIST=true
      - SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP=true
      - SYNC_GRAVITY_CLIENT=true
      - SYNC_GRAVITY_CLIENT_BY_GROUP=true
    networks:
      - proxy

networks:
  proxy:
    external: true
