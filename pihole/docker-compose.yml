services:
  pihole:
    image: pihole/pihole:2026.09.0
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=Europe/London
      - FTLCONF_webserver_api_password=${PIHOLE_WEBPASSWORD}
      - FTLCONF_dns_listeningMode=ALL
      - FTLCONF_webserver_domain=${PIHOLE_WEB_DOMAIN:-pihole.example.com}
      - FTLCONF_ntp_sync_active=false
    volumes:
      - ./data/etc-pihole:/etc/pihole
    # prdsrv2 (primary) answers on .114, prdsrv3 (second, kept in step by nebula-sync) on .115:
    # PIHOLE_BIND_IP in that host's .env
    ports:
      - "${PIHOLE_BIND_IP:-10.69.20.114}:53:53/tcp"
      - "${PIHOLE_BIND_IP:-10.69.20.114}:53:53/udp"
      # Web page for Caddy on prdsrv1: PIHOLE_WEB_BIND=10.69.20.114 on prdsrv2, .115 on prdsrv3
      # (localhost if unset)
      - "${PIHOLE_WEB_BIND:-127.0.0.1}:8081:80"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    networks:
      - proxy

networks:
  proxy:
    external: true
